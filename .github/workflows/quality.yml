name: Website Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lightworld_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lightworld_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/lightworld_ci?schema=public"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production operations scripts
        run: bash -n ops/*.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply PostgreSQL migrations
        run: bun run db:deploy

      - name: Type-check application
        run: bunx tsc --noEmit

      - name: Test security and deterministic intelligence
        run: bun test src/lib/admin-auth.test.ts src/lib/admin-totp.test.ts src/lib/support-ticket.test.ts src/lib/support-attachment.test.ts src/lib/finance.test.ts src/lib/hubtel-utils.test.ts src/lib/csv.test.ts src/lib/assistant-intents.test.ts src/lib/assistant-conversation-regression.test.ts src/lib/assistant-generative-policy.test.ts src/lib/assistant-retrieval.test.ts src/lib/lead-intelligence.test.ts src/lib/proposal-draft.test.ts src/lib/client-auth.test.ts src/lib/client-password-reset.test.ts src/lib/client-self-service.test.ts src/lib/corporate-brand-client-reset.test.ts src/lib/mail.test.ts src/lib/newsletter-campaign.test.ts src/lib/admin-governance-policy.test.ts src/lib/admin-permissions.test.ts src/lib/navigation-content.test.ts src/lib/site-content.test.ts src/lib/contact-content.test.ts src/lib/public-widget-consistency.test.ts src/lib/cookie-consent-content.test.ts src/lib/public-appearance-actions.test.ts src/lib/upload-storage.test.ts src/lib/media-library.test.ts src/lib/media-picker.test.ts src/lib/hero-media.test.ts src/lib/professional-ux.test.ts src/lib/enterprise-admin-visual.test.ts src/lib/admin-workspace-consistency.test.ts src/lib/public-brand-consistency.test.ts src/lib/public-accessibility-ux.test.ts src/lib/public-experience-quality.test.ts src/lib/operational-ux-quality.test.ts src/lib/search-visibility-authority.test.ts src/lib/local-search-crawl-hygiene.test.ts src/lib/single-supervisor-deployment.test.ts src/lib/service-search-landing.test.ts src/lib/search-internal-linking.test.ts src/lib/local-entity-authority.test.ts src/lib/careers-application.test.ts src/lib/public-rate-limit.test.ts src/lib/login-input.test.ts src/lib/next-config-security.test.ts src/lib/admin-guard-await.test.ts src/lib/admin-backend-ux-regression.test.ts
        env:
          ADMIN_SESSION_SECRET: "ci-only-admin-session-secret-at-least-32-bytes"
          CLIENT_SESSION_SECRET: "ci-only-client-session-secret-at-least-32-bytes"

      - name: Build production application
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
